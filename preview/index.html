<!doctype html>
<html lang="ja">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>今日一句｜青空文库</title>
  <style>
    body {
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Hiragino Mincho ProN",
        "Hiragino Mincho Pro",
        "Yu Mincho",
        serif;

      background: #f6f6f6;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }

    .card {
      background: white;
      padding: 24px 28px;
      border-radius: 12px;
      width: calc(100vw - 32px);
      max-width: 480px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08);
    }

    .sentence {
      font-size: clamp(16px, 4.5vw, 19px);
      line-height: 1.7;
      margin-bottom: 16px;
    }

    .meta {
      font-size: 13px;
      color: #666;
      text-align: right;
    }

    button {
      margin-top: 12px;
      padding: 8px 12px;
      font-size: 14px;
      background: none;
      border: none;
      color: #007aff;
      cursor: pointer;
    }

    @media (max-width: 480px) {
      body {
        padding: 16px;
        align-items: flex-start;
      }

      .card {
        margin-top: 20vh;
        padding: 20px;
        border-radius: 14px;
      }

      .meta {
        font-size: 12px;
      }
    }

    @media (prefers-color-scheme: dark) {
      body {
        background: #121212;
      }

      .card {
        background: #1e1e1e;
        color: #eee;
        box-shadow: none;
      }

      .meta {
        color: #aaa;
      }
    }
  </style>
</head>

<body>

  <div class="card">
    <div class="sentence" id="sentence">加载中…</div>
    <div class="meta" id="meta"></div>
    <button onclick="showRandom()">换一句</button>
  </div>

  <script>
    let quotes = [];

    fetch('quotes.json')
      .then(res => res.json())
      .then(data => {
        quotes = data;
        showRandom();
      });

    function showRandom() {
      if (!quotes.length) return;
      const q = quotes[Math.floor(Math.random() * quotes.length)];
      document.getElementById('sentence').innerText = q.first_sentence;
      document.getElementById('meta').innerText = `${q.author}《${q.title}》`;
    }
  </script>

</body>

</html>
