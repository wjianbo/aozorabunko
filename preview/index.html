<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8" />
  <title>今日一句｜青空文库</title>

  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;500&display=swap">


  <style>
    /* ========= 基础 ========= */
    html,
    body {
      height: 100%;
    }

    body {
      margin: 0;
      padding: 24px;
      box-sizing: border-box;

      display: flex;
      justify-content: center;
      align-items: center;

      background: #f7f7f7;

      overflow-y: auto;
      overscroll-behavior-y: auto;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Hiragino Mincho ProN",
        "Yu Mincho",
        serif;
    }

    /* ========= 卡片 ========= */
    .card {
      width: 100%;
      max-width: 480px;

      background: #ffffff;
      padding: 24px;
      border-radius: 16px;

      box-shadow: 0 8px 24px rgba(0, 0, 0, .08);

      display: flex;
      flex-direction: column;
    }

    /* ========= 日期（页面状态） ========= */
    .today {
      font-size: 11px;
      color: #aaa;
      margin-bottom: 14px;
      letter-spacing: 0.02em;
    }

    /* ========= 正文 ========= */
    .sentence {
      font-family: "Noto Serif JP", serif;

      font-size: clamp(16px, 4.5vw, 19px);
      line-height: 1.85;
      letter-spacing: 0.035em;

      font-weight: 400;
      text-align: left;

      word-break: break-word;
      hyphens: auto;
    }

    @supports (-webkit-touch-callout: none) {
      .sentence {
        letter-spacing: 0.04em;
        line-height: 1.9;
      }
    }

    @media (prefers-color-scheme: dark) {
      .sentence {
        color: #e6e6e6;
      }
    }

    /* ========= 作者 / 作品 ========= */
    .meta {
      margin-top: auto;
      font-size: 13px;
      color: #666;
      text-align: right;
      font-family:
        "Noto Serif JP",
        serif;
    }

    /* ========= 深色模式 ========= */
    @media (prefers-color-scheme: dark) {
      body {
        background: #121212;
      }

      .card {
        background: #1e1e1e;
        color: #eee;
        box-shadow: none;
      }

      .today {
        color: #888;
      }

      .meta {
        color: #aaa;
      }
    }
  </style>
</head>

<body>
  <div class="card">
    <div class="today" id="date">—</div>

    <div class="sentence" id="sentence">
      読み込み中…
    </div>

    <div class="meta" id="meta"></div>
  </div>

  <script>
    fetch('./daily.json')
      .then(res => res.json())
      .then(data => {
        const q = data.quote;

        document.getElementById('sentence').textContent = q.text;
        document.getElementById('meta').textContent =
          `${q.author}『${q.title}』`;
        document.getElementById('date').textContent = `今日の一句 · ${data.date}`;
      })
      .catch(err => {
        document.getElementById('sentence').textContent = '読み込みに失敗しました。';
        console.error(err);
      });
  </script>
</body>

</html>
