<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>今日一句｜青空文库</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Mincho ProN", serif;
      background: #f6f6f6;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }
    .card {
      background: white;
      padding: 24px 28px;
      border-radius: 12px;
      max-width: 480px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.08);
    }
    .sentence {
      font-size: 18px;
      line-height: 1.6;
      margin-bottom: 16px;
    }
    .meta {
      font-size: 13px;
      color: #666;
      text-align: right;
    }
    button {
      margin-top: 16px;
      background: none;
      border: none;
      color: #007aff;
      cursor: pointer;
    }
  </style>
</head>
<body>

<div class="card">
  <div class="sentence" id="sentence">加载中…</div>
  <div class="meta" id="meta"></div>
  <button onclick="showRandom()">换一句</button>
</div>

<script>
  let quotes = [];

  fetch('quotes.json')
    .then(res => res.json())
    .then(data => {
      quotes = data;
      showRandom();
    });

  function showRandom() {
    if (!quotes.length) return;
    const q = quotes[Math.floor(Math.random() * quotes.length)];
    document.getElementById('sentence').innerText = q.first_sentence;
    document.getElementById('meta').innerText = `${q.author}《${q.title}》`;
  }
</script>

</body>
</html>
