<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8" />
  <title>今日一句｜青空文库</title>

  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <style>
    body {
      margin: 0;
      padding: 24px;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #f7f7f7;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Hiragino Mincho ProN",
        "Yu Mincho",
        serif;
    }

    .card {
      width: calc(100vw - 32px);
      max-width: 480px;
      background: white;
      padding: 24px;
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, .08);
    }

    .sentence {
      font-size: clamp(16px, 4.5vw, 19px);
      line-height: 1.7;
      margin-bottom: 16px;
    }

    .meta {
      font-size: 13px;
      color: #666;
      text-align: right;
    }

    .date {
      font-size: 12px;
      color: #999;
      margin-top: 8px;
      text-align: right;
    }

    @media (prefers-color-scheme: dark) {
      body {
        background: #121212;
      }

      .card {
        background: #1e1e1e;
        color: #eee;
        box-shadow: none;
      }

      .meta,
      .date {
        color: #aaa;
      }
    }
  </style>
</head>

<body>
  <div class="card">
    <div class="sentence" id="sentence">読み込み中…</div>
    <div class="meta" id="meta"></div>
    <div class="date" id="date"></div>
  </div>

  <script>
    fetch('./daily.json')
      .then(res => res.json())
      .then(data => {
        const q = data.quote;

        document.getElementById('sentence').textContent = q.text;
        document.getElementById('meta').textContent =
          `${q.author}《${q.title}》`;
        document.getElementById('date').textContent = data.date;
      })
      .catch(err => {
        document.getElementById('sentence').textContent = '読み込みに失敗しました。';
        console.error(err);
      });
  </script>

</body>

</html>
