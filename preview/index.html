<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>今日一句｜青空文库</title>

  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <style>
    body {
      margin: 0;
      padding: 24px;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #f7f7f7;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Hiragino Mincho ProN",
        "Yu Mincho",
        serif;
    }

    .card {
      width: calc(100vw - 32px);
      max-width: 480px;
      background: white;
      padding: 24px;
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(0,0,0,.08);
    }

    .sentence {
      font-size: clamp(16px, 4.5vw, 19px);
      line-height: 1.7;
      margin-bottom: 16px;
    }

    .meta {
      font-size: 13px;
      color: #666;
      text-align: right;
    }

    .date {
      font-size: 12px;
      color: #999;
      margin-top: 8px;
      text-align: right;
    }

    @media (prefers-color-scheme: dark) {
      body { background: #121212; }
      .card {
        background: #1e1e1e;
        color: #eee;
        box-shadow: none;
      }
      .meta, .date { color: #aaa; }
    }
  </style>
</head>

<body>
  <div class="card">
    <div class="sentence" id="sentence">読み込み中…</div>
    <div class="meta" id="meta"></div>
    <div class="date" id="date"></div>
  </div>

<script>
/* ========= 日期（JST） ========= */
function todaySeedJST() {
  const now = new Date();
  const jst = new Date(now.getTime() + 9 * 60 * 60 * 1000);
  return jst.toISOString().slice(0, 10);
}

/* ========= 稳定 hash ========= */
function hash(str) {
  let h = 0;
  for (let i = 0; i < str.length; i++) {
    h = (h << 5) - h + str.charCodeAt(i);
    h |= 0;
  }
  return Math.abs(h);
}

/* ========= 选今日一句 ========= */
function pickTodayQuote(quotes) {
  const seed = todaySeedJST();
  const index = hash(seed) % quotes.length;
  return { quote: quotes[index], seed };
}

/* ========= 加载并渲染 ========= */
fetch('./quotes.json')
  .then(res => res.json())
  .then(quotes => {
    const { quote, seed } = pickTodayQuote(quotes);

    document.getElementById('sentence').textContent = quote.text;
    document.getElementById('meta').textContent =
      `${quote.author}《${quote.work}》`;
    document.getElementById('date').textContent = seed;
  })
  .catch(err => {
    document.getElementById('sentence').textContent = '読み込みに失敗しました。';
    console.error(err);
  });
</script>
</body>
</html>
