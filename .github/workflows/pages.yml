name: Deploy Pages

on:
  workflow_run:
    workflows: ["Update daily quote"]
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/daily-quote-preview

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: preview   # ⭐ 只部署这里！

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
