name: Update daily quote

on:
  schedule:
    # 每天 JST 00:05（UTC 15:05）
    - cron: "5 15 * * *"
  workflow_dispatch: # 允许手动执行

permissions:
  contents: write

jobs:
  update-daily:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate daily.json
        run: |
          python scripts/main.py

      - name: Commit if changed
        run: |
          git status --porcelain
          if [ -n "$(git status --porcelain preview/daily.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add preview/daily.json
            git commit -m "chore: update daily quote"
            git push
          else
            echo "No changes to daily.json"
          fi
